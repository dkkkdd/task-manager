<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png+xml" href="/favicon.png" />
    <link
      rel="preload"
      href="/fonts/icomoon.ttf?pwtxay"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta property="og:title" content="Task Manager" />
    <meta
      property="og:description"
      content="Task and project tracking made simple."
    />
    <meta
      name="description"
      content="Simple and efficient task and project tracking manager for better productivity."
    />

    <meta
      property="og:image"
      content="https://task-managerr.pp.ua/og-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://task-managerr.pp.ua/" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <title>Task Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </body>
</html>
